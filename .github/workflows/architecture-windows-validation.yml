name: Architecture Windows validation

on:
  push:
    branches:
      - "codex/architecture-improvements"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test on Windows
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain clean build

      - name: Smoke test Windows desktop roles and local playback
        shell: pwsh
        run: .\.github\scripts\windows-runtime-smoke.ps1
